plugins {
    id 'com.android.application'
}

android {
    namespace = "com.shahid.nid"
    buildFeatures {
        viewBinding = true
    }
    compileSdk = 37
    defaultConfig {
        applicationId "com.shahid.nid"
        minSdkVersion 23
        targetSdkVersion 36
        versionCode 55
        versionName "4.8.2"
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    lint {
        disable 'MissingTranslation'
    }
    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    testOptions {
        unitTests.includeAndroidResources = true
    }

    packaging {
        resources.excludes += ['META-INF/DEPENDENCIES', 'META-INF/INDEX.LIST']
    }
}


dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation 'androidx.constraintlayout:constraintlayout:2.2.1'
    androidTestImplementation('androidx.test.espresso:espresso-core:3.1.0', {
        exclude group: 'com.android.support', module: 'support-annotations'
    })

    // Android Support Libraries
    implementation 'androidx.biometric:biometric:1.1.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.cardview:cardview:1.0.0'
    implementation 'androidx.appcompat:appcompat:1.7.1'
    implementation "com.android.billingclient:billing:8.3.0"

    // Google sign-in and Drive REST API
    implementation 'com.google.android.gms:play-services-auth:21.4.0'

    implementation 'com.google.api-client:google-api-client:2.8.1'

    implementation 'com.google.http-client:google-http-client-gson:1.47.1'
    implementation('com.google.api-client:google-api-client-android:2.8.1') {
        exclude group: 'org.apache.httpcomponents'
    }
    implementation('com.google.apis:google-api-services-drive:v3-rev20260901-2.0.0') {
        exclude group: 'org.apache.httpcomponents'
    }

    // Third party libraries
    implementation 'de.hdodenhof:circleimageview:3.1.0'
    implementation 'com.google.code.gson:gson:2.13.2'
    implementation 'com.google.guava:guava:33.4.8-android'


    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.robolectric:robolectric:4.16.1'

}
